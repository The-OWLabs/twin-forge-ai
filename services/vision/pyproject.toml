[project]
name = "twinforge-vision"
version = "0.1.0"
description = "TwinForge AI vision service: deterministic OpenCV inspection behind a FastAPI API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2.13,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
