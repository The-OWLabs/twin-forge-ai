# Firebase App Hosting configuration for TwinForge AI.
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  # Demo state lives in the instance (/tmp). One instance keeps every visitor on the same factory.
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability: [BUILD, RUNTIME]
  - variable: TWINFORGE_DATA_DIR
    value: /tmp/twinforge
    availability: [RUNTIME]
  # Gemini on Vertex AI. The App Hosting service account has roles/aiplatform.user.
  # asia-southeast1 is co-located with this backend; the global endpoint occasionally stalled in tests.
  - variable: GOOGLE_CLOUD_PROJECT
    value: twin-forge
    availability: [RUNTIME]
  - variable: GOOGLE_CLOUD_LOCATION
    value: asia-southeast1
    availability: [RUNTIME]
  - variable: GEMINI_MODEL
    value: gemini-3.5-flash
    availability: [RUNTIME]
  # Integration settings changed in the UI (Integrations page) are saved to this private bucket, so
  # they survive instance restarts. This backend's service account has roles/storage.objectAdmin on it.
  - variable: TWINFORGE_CONFIG_BUCKET
    value: twin-forge-twinforge-config
    availability: [RUNTIME]
  # Admin passcode (Secret Manager) that unlocks camera sources and integration settings in the UI.
  # Without it, admin changes are disabled on Cloud Run. Rotate with:
  #   firebase apphosting:secrets:set twinforge-admin-key --project twin-forge
  - variable: TWINFORGE_ADMIN_KEY
    secret: twinforge-admin-key
    availability: [RUNTIME]
  # The Python vision service (services/vision, private Cloud Run service) is configured from the UI:
  # Integrations → Vision service. Or set it here as the deployment default:
  # - variable: VISION_SERVICE_URL
  #   value: https://twinforge-vision-566093229758.asia-southeast1.run.app
  #   availability: [RUNTIME]
